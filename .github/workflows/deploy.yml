name: Build, Deploy e Segurança Onco

on:
  push:
    branches:
      - main

jobs:
  # Job 1: Analisar o código (SAST) - O "Porteiro" 🛡️
  analyze-code:
    name: Analisar Código (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript # Focado no seu Next.js e Nest.js

      - name: Executar Análise
        uses: github/codeql-action/analyze@v3

  # Job 2: Build e Push - Só inicia se o CodeQL passar ✅
  build-and-deploy:
    name: Build e Push Docker
    runs-on: ubuntu-latest
    needs: analyze-code  # <--- Esta linha cria a dependência
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/onco:backend

      - name: Build e Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/onco:frontend

  # Job 3: Scan de Imagem (SCA) - Varredura final 🐳
  security-scan:
    name: Scan de Vulnerabilidades (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/onco:backend'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          github-pat: ${{ secrets.GITHUB_TOKEN }}
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/onco:frontend'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          github-pat: ${{ secrets.GITHUB_TOKEN }}
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}